# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - "nulo.html"
      - "nulo.css"
      - "nulo.js"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ASCII index.html from nulo files
        shell: python
        run: |
          import re
          
          def clean_to_ascii(text):
              return "".join(char for char in text if ord(char) <= 127)
          
          # Read source files
          with open("nulo.html", "r", encoding="utf-8") as f:
              html = clean_to_ascii(f.read())
          with open("nulo.css", "r", encoding="utf-8") as f:
              css = clean_to_ascii(f.read())
          with open("nulo.js", "r", encoding="utf-8") as f:
              js = clean_to_ascii(f.read())

          # Format replacement tags
          #inline_css = f"<style>\n{css}\n</style>"
          #inline_js = f"<script>\n{js}\n</script>"

          # Inline replace the CSS @import line
          html = re.sub(r'@import\s+url\(["\']?.*?nulo\.css["\']?\);?', lambda m: css, html, flags=re.IGNORECASE)
                    
          # Inline replace the JS fetch shortie line
          html = re.sub(r'fetch\(["\']\./nulo\.js["\']\)\s*\.\s*then\(\s*r\s*=>\s*r\.text\(\)\s*\)\s*\.\s*then\(\s*eval\s*\);?', lambda m: js, html, flags=re.IGNORECASE)

          # Double-check the final output just in case
          html = clean_to_ascii(html)          

          # Write out the generated index.html
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
