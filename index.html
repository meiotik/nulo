<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Wallet Statements Cost basis Comptometer for Luno</title>
 <style>
  body, html {
   margin: 0;
   padding: 0;
   width: 100%;
   height: 100%;
   font-family: system-ui,-apple-system,sans-serif;
   background-color: #eee;
   color: #134;
   overflow: hidden;
  }

  .file {
   position: relative;
   display: inline-block;
   cursor: pointer;
   height: 1.5rem;
  }

  .file input {
   min-width: 14rem;
   margin: 0;
   filter: alpha(opacity=0);
   opacity: 0;
  }

  .file-custom {
   position: absolute;
   top: 0;
   right: 0;
   left: 0;
   z-index: 5;
   height: 1.5rem;
   padding: .5rem 1rem;
   line-height: 1.5;
   color: #555;
   background-color: #fff;
   border: .075rem solid #ddd;
   border-radius: .25rem;
   box-shadow: inset 0 .2rem .4rem rgba(0,0,0,.05);
   -webkit-user-select: none;
      -moz-user-select: none;
       -ms-user-select: none;
           user-select: none;
  }

  .file-custom:after {
   content: "Load .zip or .csv...";
  }
  
  .file-custom:before {
   position: absolute;
   top: -.075rem;
   right: -.075rem;
   bottom: -.075rem;
   z-index: 6;
   display: block;
   content: "\1f4c2\fe0f";
   height: 1.5rem;
   padding: .5rem 1rem;
   line-height: 1.5;
   color: #555;
   background-color: #eee;
   border: .075rem solid #ddd;
   border-radius: 0 .25rem .25rem 0;
  }

  .file input:focus ~ .file-custom {
   box-shadow: 0 0 0 .075rem #fff, 0 0 0 .2rem #07d;
  }

  #drop-zone-overlay {
   opacity: 0.4;
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   background-color: #ddd;
   border: 0.25rem dashed transparent;
   display: flex;
   justify-content: center;
   align-items: center;
   z-index: 5;
   transition: all 0.2s ease;
   pointer-events: none;
  }

  #drop-zone-overlay.drag-active {
   background-color: #ccc;
   border-color: #48f;
  }

  #drop-zone-overlay .overlay-prompt {
   padding: 5rem 10rem;
   border-radius: .25rem;
   box-shadow: 0 1rem 2rem -2rem #666;
   font-size: 1.2rem;
   font-weight: bold;
   color: #26e;
   background-color: #bbb;
   transform: scale(0.9);
   opacity: 0;
   transition: all 0.2s ease;
  }

  #drop-zone-overlay.drag-active .overlay-prompt {
   transform: scale(1);
   opacity: 1;
  }
 </style>
</head>
<body>
 <div class="top-bar">
  <div class="button-group">
   <label class="file" for="file-btn">
    <input type="file" id="file-btn" multiple accept=".csv, .zip" aria-label="Load .CSV or .ZIP statements" title="Load .CSV or .ZIP statements"/>
    <span class="file-custom"></span>
   </label>
   <button class="btn btn-clear" id="clear-btn" style="display: none;" aria-label="Unload all statements" title="Unload all statements">
    <span aria-hidden="true">&#x1f5d1;&#xfe0f;</span>
   </button>
  </div>
  <div id="chip-container"></div>
 </div>

 <div class="main-container"></div>

 <div id="drop-zone-overlay">
  <div class="overlay-prompt">Drop files to add</div>
 </div>

 <script>
  const fileInput = document.getElementById('file-btn');
  const clearBtn = document.getElementById('clear-btn');
  const chipsDiv = document.getElementById('chip-container');
  const dropZoneOverlay = document.getElementById('drop-zone-overlay');
  let openFiles = [];
  
  function unzipFiles(files) {
    if (files.length === 0) return;
    const allowedExtensions = /(\.csv|\.zip)$/i;
    Array.from(files).forEach(file => {
      if (allowedExtensions.exec(file.name)) {
        const isDuplicate = openFiles.some(f => f.name === file.name && f.size === file.size);
        if (!isDuplicate) {
          openFiles.push(file);
        }
      } else {
        console.warn(`File rejected: "${file.name}"`);
      }
    });
    showChips();
    fileInput.value = '';
  }
  
  function showChips() {
    chipsDiv.innerHTML = '';
    if (openFiles.length === 0) {
      clearBtn.style.display = 'none';
      return;
    }
    clearBtn.style.display = 'flex';
    openFiles.forEach((file, index) => {
      const chip = document.createElement('div');
      chip.className = 'file-chip';
      const textSpan = document.createElement('span');
      textSpan.className = 'chip-text';
      textSpan.title = file.name;
      textSpan.textContent = file.name;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'chip-remove';
      removeBtn.innerHTML = '&#x1f5d9;&#xfe0f;';
      removeBtn.ariaLabel = `Remove ${file.name}`;
      removeBtn.addEventListener('click', () => removeFile(index));
      chip.appendChild(textSpan);
      chip.appendChild(removeBtn);
      chipsDiv.appendChild(chip);
    });
    console.log("Files staged:", openFiles);
  }
  
  function removeFile(index) {
    openFiles.splice(index, 1);
    showChips();
  }
  
  clearBtn.addEventListener('click', () => {
    openFiles = [];
    showChips();
  });
  
  fileInput.addEventListener('change', (e) => unzipFiles(e.target.files));
  
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    window.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, false);
  });
  
  let dragCounter = 0;
  
  window.addEventListener('dragenter', () => {
    dragCounter++;
    dropZoneOverlay.classList.add('drag-active');
  });
  
  window.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter === 0) dropZoneOverlay.classList.remove('drag-active');
  });
  
  window.addEventListener('drop', (e) => {
    dragCounter = 0;
    dropZoneOverlay.classList.remove('drag-active');
    unzipFiles(e.dataTransfer.files);
  });
 </script>
</body>
</html>
