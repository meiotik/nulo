<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Statements Cost Basis Comptometer for Luno.</title>
<style>
@import url("nulo.css");
/*# sourceURL=nulo.css */   
</style>
</head>
<body>
<div id="drop-zone-overlay">
	<div class="overlay-prompt">Drop .CSV or .ZIP files here</div>
</div>
<div class="top-bar">
	<div class="button-group">
		<label class="file" for="file-btn">
			<input type="file" id="file-btn" multiple accept=".csv, .zip" aria-label="Load .CSV or .ZIP files" title="Load .CSV or .ZIP files"/>
			<span class="file-custom"></span>
		</label>
		<button class="btn btn-clear" id="clear-btn" style="display: none;" aria-label="Unload all statements" title="Unload all statements">
			<span aria-hidden="true">&#x1f5d1;&#xfe0f;</span>
		</button>
	</div>
	<div id="chip-container"></div>
</div>
<div class="main-container"></div>
<script>
fetch('./nulo.js').then(r => r.text()).then(eval);
//# sourceURL=nulo.js
</script>
</body>
</html>
